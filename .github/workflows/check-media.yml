name: Check media

# The media of the studies live on MPCDF DataShare (public links). Check weekly, and for each pull request, that
# all media of the published studies are reachable with the right content types.
on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check the media of all published studies
        run: python tools/study.py check --published
