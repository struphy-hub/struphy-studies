site_name: Struphy studies
site_url: https://struphy-hub.github.io/struphy-studies/
site_description: Numerical studies with Struphy, with the runs to reproduce them and their figures and videos.
repo_url: https://github.com/struphy-hub/struphy-studies
repo_name: struphy-hub/struphy-studies
edit_uri: ""
# generated by tools/build_site.py from studies/*/study.yaml
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/struphy_logo.jpg
  favicon: assets/struphy_logo.jpg
  features:
    - content.code.copy
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  - assets/extra.css

plugins:
  - search
  - glightbox:
      auto_caption: false
      zoomable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
