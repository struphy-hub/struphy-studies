    params: params_tokamak_equilibrium.py
    command: "mpirun -n 4 python params_tokamak_equilibrium.py --sim-folder shift_b0 --save-step 5 --shift B0"  # or: bash run_case.sh shift_b0 --shift B0
    pproc: "python pproc_tokamak_equilibrium.py shift_b0 --save-step 5 --shift B0 --video"
    videos:
      - runs/shift_b0/videos/distribution.mp4
    figures:
      - runs/shift_b0/figures/binning_e1_density.png
      - runs/shift_b0/figures/binning_e1_e2_density.png
      - runs/shift_b0/figures/binning_e1_v1_density.png
      - runs/shift_b0/figures/binning_v1_density.png
      - runs/shift_b0/figures/binning_v1_v2_density.png
      - runs/shift_b0/figures/binning_v2_density.png
      - runs/shift_b0/figures/deviation.png
      - runs/shift_b0/figures/distribution.png
      - runs/shift_b0/figures/scalars.png

  - name: gyro
    description: "gyro-Maxwellian with the same profiles in the flux label of the position (control, not an equilibrium)"
    params: params_tokamak_equilibrium.py
    command: "mpirun -n 4 python params_tokamak_equilibrium.py --sim-folder gyro --save-step 5 --init gyro"  # or: bash run_case.sh gyro --init gyro
    pproc: "python pproc_tokamak_equilibrium.py gyro --save-step 5 --init gyro --video"
    videos:
      - runs/gyro/videos/distribution.mp4
    figures:
      - runs/gyro/figures/binning_e1_density.png
      - runs/gyro/figures/binning_e1_e2_density.png
      - runs/gyro/figures/binning_e1_v1_density.png
