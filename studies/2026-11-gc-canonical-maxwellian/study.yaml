  - name: rk4
    description: "as base, both pushers explicit RK4"
    params: params_tokamak_equilibrium.py
    command: "mpirun -n 4 python params_tokamak_equilibrium.py --sim-folder rk4 --save-step 5 --algo explicit --butcher rk4"  # or: bash run_case.sh rk4 --algo explicit --butcher rk4
