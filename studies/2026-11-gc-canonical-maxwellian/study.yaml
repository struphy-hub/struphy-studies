runs:
  - name: base
    description: canonical Maxwellian, shift Bmax, epsilon = 0.05, discrete gradient 1st order, grid 16 x 48 x 48, 25 markers per cell, T = 100
    params: params_tokamak_equilibrium.py
    command: "mpirun -n 4 python params_tokamak_equilibrium.py --sim-folder base --save-step 5"  # or: bash run_case.sh base
    pproc: "python pproc_tokamak_equilibrium.py base --save-step 5 --video"
    videos:
      - runs/base/videos/distribution.mp4
    figures:
      - runs/base/figures/binning_e1_density.png
      - runs/base/figures/binning_e1_e2_density.png
      - runs/base/figures/binning_e1_v1_density.png
      - runs/base/figures/binning_v1_density.png
      - runs/base/figures/binning_v1_v2_density.png
      - runs/base/figures/binning_v2_density.png
      - runs/base/figures/deviation.png
      - runs/base/figures/distribution.png
      - runs/base/figures/scalars.png
