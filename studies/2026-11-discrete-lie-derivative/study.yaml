    command: "mpirun -n 4 python params_linear.py --model q --case kink --dt 0.5 --tend 400 --save-velocity --sim-folder q_kink_dt0.5"
    pproc: "python compare_timerun.py"
    videos: []
    figures: []

  - name: var_kink_dt0.5
    description: variational p model (VariationalLinearMHD, L2 transport), kink case, dt = 0.5, T = 400, 16 x 12 x 12, velocity saved
    params: params_linear.py
    command: "mpirun -n 4 python params_linear.py --model var --case kink --dt 0.5 --tend 400 --save-velocity --sim-folder var_kink_dt0.5"
