# Study of struphy-studies, see the README of the repository for the fields.
title: "Low-mode TAE with ShearAlfven: convergence and the mode structure near the axis"
date: 2026-11-11
# drafts are not published on the site (preview them with: python tools/build_site.py --drafts)
draft: true
struphy:
  # the Struphy commit the runs were made with (pip install "struphy @ git+https://github.com/struphy-hub/struphy@<commit>")
  commit: null
  version: null
# one sentence, shown on the landing page
summary: The low-mode TAE of the ShearAlfven model is converged in frequency and mode structure, and its m = 1 support towards the magnetic axis is physical, as runs with polar splines (no hole) confirm.
description: |
  **Question.** In the low-mode TAE example of the ShearAlfven model (`examples/ShearAlfven/lowmode_tae`), the radial
  velocity of the mode keeps a large m = 1 component all the way to the magnetic axis. Is this physical, or a numerical
  artefact (resolution, the hole around the axis and its boundary condition, the discretization of the magnetic field)?
  And is the TAE frequency converged?

  **Setup.** Toroidal Alfvén eigenmode with n = 1 in the gap of the m = 1 and m = 2 shear Alfvén continua at q = 3/2:
  `AdhocTorus` equilibrium (R0 = 5, a = 1, B0 = 1, q = 1.25 + r², flat density, beta 0.0018) on a `HollowTorus`
  (hole radius 0.01) or, with polar splines, an `IGAPolarTorus` (no hole). The TAE is excited by an initial velocity with
  m = 1 and m = 2 harmonics around r = 0.5; no energetic particles. Implicit shear Alfvén step, dt = 0.5, T = 1200
  (about 13 periods), splines of degree 3. The base run uses 16 x 16 x 8 elements, the magnetic field in H(div) and
  Dirichlet conditions at both radial boundaries; the other runs change one thing each (see the table of runs).

  **Analysis** (`pproc_ShearAlfven.py` and the scripts in `params/`, see `struphy.post_processing.mode_analysis`):
  the radial velocity is Fourier-transformed in the poloidal and toroidal angles at all saved times, and the
  coefficients c_m(r, t) of n = 1 are transformed in time (Hann window). The frequency of the TAE is the peak of the
  m = 1 spectrum at r = 0.5. The **mode structure** is the amplitude |c_m(r, omega)| at that frequency: it filters the
  eigenmode from the continuum oscillations of the run, whose radial structure gets finer in time (phase mixing) and
  therefore differs between snapshots of runs with different resolution.

  The Struphy commit will be given once the polar preconditioner (struphy#918) and the projected equilibrium in the
  FEEC space (struphy#922) are merged: the polar run uses them.
findings: |
  | run | change | omega (FFT peak) | deviation from 0.0672 | TAE structure vs base | m = 1 weight r < 0.25 |
  |---|---|---|---|---|---|
  | base | 16 x 16 x 8, H(div), hole 0.01 | 0.0621 | -7.6% | - | 0.29 |
  | z4 / z16 | toroidal 4 / 16 elements | 0.0588 / 0.0621 | -12.4% / -7.6% | - / 1.7% | 0.26 / 0.29 |
  | r32 / r64 | radial 32 / 64 elements | 0.0621 | -7.6% | 10% / 9.8% (r64 vs r32: 0.5%) | 0.28 |
  | th32 | poloidal 32 elements | 0.0621 | -7.6% | 1.3% | 0.28 |
  | bcfree | free BC at the hole | 0.0621 | -7.6% | 7% (first points only) | 0.29 |
  | a1_0.1 | hole radius 0.1 | 0.0621 | -7.6% | 16% | 0.13 |
  | hcurl | magnetic field in H(curl) | 0.0621 | -7.6% | 31% (noise near the axis) | 0.30 |
  | polar | polar splines, no hole (16 x 18 x 8) | 0.0621 | -7.6% | 4% | 0.29 |

  The expected frequency 0.0672 is the center of the gap, n v_A / ((2m + 1) R0); the frequency resolution 2 pi / T is
  0.0052.

  1. **The frequency is converged**: 0.0621 for all resolutions and variants, 7.6% below the center of the gap. Only 4
     toroidal elements are too few (-12.4%, the near cancellation of n q - m amplifies errors of the toroidal wave
     number); 8 suffice.
  2. **The mode structure is converged at 32 radial elements** (r64 vs r32: 0.5%); poloidally 16 and toroidally 8
     elements suffice. With 16 radial elements the shape is right but about 10% off, mostly the height of the m = 2
     peak. Snapshots of the full field differ much more between resolutions (24% at t = 600, 49% at t = 1200), because
     of the continuum oscillations, not of the TAE: compare the filtered structure, not snapshots.
  3. **The m = 1 support towards the axis is physical.** The run with polar splines (no hole, C1-regular at the axis)
     has the same m = 1 plateau (about 55% of the peak) down to r = 0, and m = 2 goes to zero at the axis. This is the
     regular m = 1 behaviour (a rigid shift, constant near the axis); the m = 1 continuum crosses the TAE frequency at
     r of about 0.42, so the m = 1 part is barely evanescent inside the gap. Artificial boundary conditions reduce
     rather than cause it: a hole of radius 0.1 with u.n = 0 pulls m = 1 down. The H(curl) discretization shows noise
     near the axis (a numerical artefact of that variant); its main lobe agrees.

  ![Mode structure at the TAE frequency: base, polar splines and 16 toroidal elements](media:figures/filtered_polar_z16.png)

  ![Radial convergence of the mode structure: 32 vs 64 radial elements](media:figures/filtered_radial_r32_r64.png)

  ![Hole, boundary condition and H(curl)](media:figures/filtered_hole_bc_hcurl.png)

  ![Snapshots at t = 1200 differ by the continuum oscillations (base vs 32 radial elements)](media:figures/snapshot_plane_base_vs_r32_t1200.png)
