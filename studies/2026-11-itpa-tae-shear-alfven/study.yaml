# Study of struphy-studies, see the README of the repository for the fields.
title: "ITPA TAE with ShearAlfven: magnetic field in H(curl) vs H(div)"
date: 2026-11-12
# drafts are not published on the site (preview them with: python tools/build_site.py --drafts)
draft: true
struphy:
  # the Struphy commit the runs were made with (pip install "struphy @ git+https://github.com/struphy-hub/struphy@<commit>")
  commit: d19ccc98e8bf20f10b00fcef8998adffef46bb19
  version: "3.6.1"
# caption of the thumbnail on the landing page
thumbnail_caption: "Run hcurl_24x88x8: radial velocity (first component of u in the 2-form basis) at t = 250, 3D view of the torus sector"
# one sentence, shown on the landing page
summary: "DRAFT: The ShearAlfven model reproduces the n = 6 TAE of the ITPA benchmark with the magnetic field in H(curl) (4.17e5 rad/s, ITPA 4.07e5 rad/s); runs with H(div) and on the coarser grid 24 x 44 x 8 are pending."
description: |
  **Question.** The ShearAlfven model has two discretizations of the magnetic field: in H(curl) (`b_space="Hcurl"`,
  implicit curl-curl solve for the magnetic field, preconditioned by Hiptmair-Xu; not exactly energy conserving) and in
  H(div) (`b_space="Hdiv"`, implicit Schur solve for the velocity, Kronecker preconditioner with E x B correction;
  exactly energy conserving). Do both give the toroidal Alfvén eigenmode (TAE) of the ITPA benchmark, at which
  resolution, and how do they differ in energy behaviour and mode structure? The runs are the physics check of the
  strong-scaling profiling cases of the same example (struphy#932, `submit_ShearAlfven_scaling.py`), which time the
  same setup with several preconditioners per space.

  **Setup** (`examples/ShearAlfven/itpa_tae_benchmark`, Koenies et al., Nucl. Fusion 58, 126027 (2018)).
  Large-aspect-ratio tokamak with circular flux surfaces (`AdhocTorus`): R0 = 10, a = 1, B0 = 3,
  q(r) = 1.71 + 0.16 r², flat hydrogen density 2e19 m⁻³, beta 0.0018. Only n = 6 is computed, on a sixth of the torus
  (`HollowTorus`, tor_period = 6, hole of radius 0.1). The TAE sits in the gap of the m = 10 and m = 11 continua at
  q = 1.75, r = 0.5, with omega_TAE = n / (2m + 1) v_A / R0 = 0.0859 (Alfvén units; 4.2e5 rad/s) at the center of
  the gap; the ITPA ideal MHD frequency is 4.07e5 rad/s (mean of CAS3D 4.01e5 and GYGLES 4.13e5). The TAE is excited
  by an initial velocity with m = 10 and 11 harmonics around r = 0.5; no energetic particles. Cubic splines,
  dt = 0.2, T = 500 (about 6.8 periods), 4 MPI ranks. With H(div), Dirichlet conditions at both radial walls; with
  H(curl), free conditions (u.n = 0 weakly).

  **Analysis** (`pproc_ShearAlfven.py`, `compare.py`, see `struphy.post_processing.mode_analysis`). The radial velocity
  is Fourier-transformed in the poloidal and toroidal angles at all saved times; the coefficients c_m(r, t) of n = 6
  are transformed in time (Hann window). The pproc measures the frequency as the refined spectral peak of the
  (m = 10, n = 6) coefficient at r = 0.5, projected on its initial phase; `compare.py` gives the FFT peak at
  r = 0.5, the (r, omega) map with the cylindrical continua and the mode structure |c_m(r, omega)| at the TAE
  frequency. The frequency resolution 2 pi / T is 0.0126.
findings: |
  | run | magnetic field | grid | omega (pproc) | omega [rad/s] | dev. from ITPA | energy at T / initial |
  |---|---|---|---|---|---|---|
  | hcurl_24x88x8 | H(curl), Hiptmair-Xu | 24 x 88 x 8 | 0.0855 | 4.17e5 | +2.5% | 0.896 |
  | hdiv_24x88x8 | H(div), Kronecker | 24 x 88 x 8 | pending | | | |
  | hcurl_24x44x8 | H(curl), Hiptmair-Xu | 24 x 44 x 8 | pending | | | |
  | hdiv_24x44x8 | H(div), Kronecker | 24 x 44 x 8 (T = 300) | pending | | | |

  1. **H(curl) on 24 x 88 x 8 has the TAE**: omega = 0.0855 (0.4% below the center of the gap, 2.5% above the ITPA
     value). The FFT peak at r = 0.5 is 0.0831, within the frequency resolution 0.0126. The (r, omega) map shows the
     mode in the gap at the crossing of the m = 10 and m = 11 continua; its structure is dominated by m = 10, with
     m = 11 at about 60% and small m = 9 and m = 12 sidebands, localized in 0.4 < r < 0.6.
  2. **Energy**: the H(curl) step loses 10% of the energy up to T = 500, slowly at first and faster after t = 300,
     when phase mixing of the continuum oscillations creates finer radial structure (much less than the 56% left at
     t = 300 that the example description gives for 24 x 44 x 8).

  ![Spectrum |A_10(r = 0.5, omega)|² of the run hcurl_24x88x8; dashed: center of the gap 0.0859, gray: +-10%.](media:figures/compare_spectra.png)

  ![Run hcurl_24x88x8: log10 of |A_m(r, omega)| for m = 9 ... 12 with the cylindrical continua (white; solid: the m of the panel); red dashed: center of the gap.](media:figures/omega_r_hcurl_24x88x8.png)
