    caption: "Spectra |A_10(r = 0.5, omega)|² of the (m = 10, n = 6) harmonic of the radial velocity, one line per run; dashed: center of the gap 0.0859, gray: +-10%."
  - path: figures/omega_r_hcurl_24x88x8.png
    caption: "Run hcurl_24x88x8: log10 of |A_m(r, omega)| of the radial velocity for m = 9 ... 12 (n = 6) with the cylindrical shear Alfvén continua (white; solid: the m of the panel); red dashed: center of the gap."
  - path: figures/profiles_hcurl_24x88x8.png
    caption: "Run hcurl_24x88x8: mode structure |A_m(r, omega)| of the radial velocity at the FFT peak omega = 0.0831; colors: m = 9 (blue), 10 (orange), 11 (green), 12 (red); dotted: r = 0.5."
  - path: figures/compare_energy.png
    caption: "Total energy over the initial one, one line per run."
