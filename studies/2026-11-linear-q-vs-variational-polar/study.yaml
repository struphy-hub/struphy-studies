runs:
  - name: q_stable_dt0.5
    description: q model (LinearMHDWithQ, B in H(div)), stable case, dt = 0.5, T = 100, 16 x 12 x 12
    params: params_linear.py
    command: "mpirun -n 4 python params_linear.py --model q --case stable --dt 0.5 --tend 100 --sim-folder q_stable_dt0.5"
    pproc: "python compare_energy.py"
    videos: []
    figures: []

  - name: var_stable_dt0.5
    description: variational p model (VariationalLinearMHD, L2 transport), stable case, dt = 0.5, T = 100, 16 x 12 x 12
    params: params_linear.py
    command: "mpirun -n 4 python params_linear.py --model var --case stable --dt 0.5 --tend 100 --sim-folder var_stable_dt0.5"
    pproc: "python compare_energy.py"
    videos: []
    figures: []

  - name: q_stable_dt0.125
    description: q model, stable case, dt = 0.125, T = 100, 16 x 12 x 12
    params: params_linear.py
    command: "mpirun -n 4 python params_linear.py --model q --case stable --dt 0.125 --tend 100 --sim-folder q_stable_dt0.125"
    pproc: "python compare_energy.py"
    videos: []
    figures: []

  - name: var_stable_dt0.125
    description: variational p model (L2 transport), stable case, dt = 0.125, T = 100, 16 x 12 x 12
    params: params_linear.py
    command: "mpirun -n 4 python params_linear.py --model var --case stable --dt 0.125 --tend 100 --sim-folder var_stable_dt0.125"
    pproc: "python compare_energy.py"
    videos: []
    figures: []

  - name: q_kink_dt0.5
    description: q model, kink case, dt = 0.5, T = 400, 16 x 12 x 12, velocity saved (finding 9)
    params: params_linear.py
    command: "mpirun -n 4 python params_linear.py --model q --case kink --dt 0.5 --tend 400 --save-velocity --sim-folder q_kink_dt0.5"
